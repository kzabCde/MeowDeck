name: Validate MeowDeck Core Engine

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/validate-engine.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/validate-engine.yml"

jobs:
  core-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run unit and deterministic full-match tests
        run: npm test
      - name: Run standalone headless match example
        run: npm run test:simulation
