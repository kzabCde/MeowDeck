name: Validate MeowDeck Next.js Gameplay
on:
  push:
    branches: ['main']
    paths:
      - 'src/app/**'
      - 'src/web/**'
      - 'public/icons/**'
      - 'scripts/build-offline.mjs'
      - 'scripts/sw.template.js'
      - 'src/games/**'
      - 'e2e/**'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright*.ts'
      - '.github/workflows/validate-ui.yml'
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/web/**'
      - 'public/icons/**'
      - 'scripts/build-offline.mjs'
      - 'scripts/sw.template.js'
      - 'src/games/**'
      - 'e2e/**'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright*.ts'
      - '.github/workflows/validate-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck headless engine
        run: npm run typecheck:engine
      - name: Check Next.js App Router types
        run: npm run typecheck
      - name: Run core and P3 tests
        run: npm test
      - name: Deterministic full match
        run: npm run test:simulation
      - name: Benchmark AI strategies
        run: npm run benchmark:ai
      - name: Evaluate paired-seed AI differentiation
        run: npm run evaluate:ai | tee ai-evaluation.log
      - name: Validate all production art
        run: |
          python -m pip install -r requirements-assets.txt
          npm run validate:assets
      - name: Build Next.js production app
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify Playwright development/production suite separation
        run: |
          npx playwright test --config=playwright.config.ts --list > /tmp/meowdeck-dev-tests.txt
          if grep -Eq 'offline[.]spec[.]ts|production[.]spec[.]ts' /tmp/meowdeck-dev-tests.txt; then
            echo 'Production-only specs leaked into the development suite'
            cat /tmp/meowdeck-dev-tests.txt
            exit 1
          fi
          npx playwright test --config=playwright.production.config.ts --list > /tmp/meowdeck-prod-tests.txt
          grep -q 'offline.spec.ts' /tmp/meowdeck-prod-tests.txt
          grep -q 'production.spec.ts' /tmp/meowdeck-prod-tests.txt
      - name: Run seeded development E2E
        run: npm run test:e2e
      - name: Run focused cross-browser gameplay smoke
        run: npm run test:e2e:cross-browser
      - name: Run production build E2E
        run: npm run test:e2e:production
      - name: Upload production UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meowdeck-visual-review
          path: test-results/visual-review/
          if-no-files-found: ignore
      - name: Upload AI balance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meowdeck-ai-evaluation
          path: ai-evaluation.log
          if-no-files-found: ignore
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-migration-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
